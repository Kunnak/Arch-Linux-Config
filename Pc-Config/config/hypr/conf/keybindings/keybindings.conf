# ────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
bind = , 86, exec, wtype "<"                                                                    # Kinesis Rebinding <
bind = , 82, exec, wtype ">"                                                                    # Kinesis Rebinding >
bind = MOD5, f, exec, wtype "|"                                                                 # Kinesis Rebinding |
bind = MOD5, minus, exec, wtype "\`"
bind = MOD5, l, exec, wtype "─"                                                                 # AltGr + L  →  ─
bind = MOD5 SHIFT, l, exec, wtype "━"                                                           # AltGr + K  →  ━


