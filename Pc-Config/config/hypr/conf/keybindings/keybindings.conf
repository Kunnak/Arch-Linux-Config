bind = $mainMod, Y, exec, grimblast --wait 0.5 copy area --notify                               # Screenshot für einen Bereich
bind = $mainMod, C, exec, hyprpicker -a                                                         # Monitor Color-Picker
bind = SUPER, Space, exec, ~/.local/bin/tools-menu.sh


