# Waypaper
windowrule {
    name = Waypaper-Windowrule
    match:class = waypaper
    float = true
    size = 850 1200
}

# Pavucontrol
windowrule {
    name = Pavucontrol-Windowrule
    match:class = org.pulseaudio.pavucontrol
    float = true
    size = 1200 900
}
