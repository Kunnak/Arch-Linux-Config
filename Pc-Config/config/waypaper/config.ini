[Settings]
language = en
folder = ~/Bilder/Wallpaper/Waypaper-Wallpaper
wallpaper = ~/Bilder/Wallpaper/Waypaper-Wallpaper/Old/blue-moon-anime.jpg
backend = swww
monitors = All
fill = fill
sort = name
color = #000000
subfolders = True
show_hidden = False
show_gifs_only = False
post_command = ~/.config/hypr/scripts/wallpaper.sh "$wallpaper" > /dev/null 2>&1
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
use_xdg_state = False
show_path_in_tooltip = True
all_subfolders = False
zen_mode = False
mpvpaper_sound = False
mpvpaper_options = 
stylesheet = /home/yannick/.config/waypaper/style.css

