[Settings]
language = en
folder = ~/Wallpaper
monitors = All
wallpaper = ~/Wallpaper/Anime/Anime-Girls/blue-moon-anime-girl.jpg
show_path_in_tooltip = True
backend = swww
fill = stretch
sort = date
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = ~/.config/hypr/scripts/wallpaper.sh "$wallpaper" > /dev/null 2>&1
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
stylesheet = /home/yannick/.config/waypaper/style.css

