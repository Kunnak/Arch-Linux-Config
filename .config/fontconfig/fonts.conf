<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Monospace Fallback -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>monospace</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Ubuntu Mono</string>
        </edit>
    </match>

    <!-- Sans Fallback -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>sans</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Ubuntu</string>
        </edit>
    </match>

    <!-- Serif Fallback -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>serif</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Ubuntu</string>
        </edit>
    </match>
</fontconfig>


